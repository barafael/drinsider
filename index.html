<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>drinsider</title>
    <meta name="description" content="Analyze ELF binaries like a normal person: a windowed port of binsider." />
    <link data-trunk rel="rust" data-bin="drinsider" data-wasm-opt="z"
          data-wasm-opt-params="--enable-bulk-memory --enable-nontrapping-float-to-int --enable-sign-ext --enable-reference-types --enable-multivalue --enable-mutable-globals" />
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0e1117; }
      @media (prefers-color-scheme: light) { html, body { background: #ffffff; } }
      canvas { display: block; width: 100%; height: 100%; }
      #loading { position: absolute; inset: 0; display: grid; place-items: center; margin: 0;
                 font: 16px system-ui, sans-serif; color: #a9b4c4; }
    </style>
  </head>
  <body>
    <canvas id="drinsider_canvas"></canvas>
    <p id="loading">Loading drinsider…</p>
  </body>
</html>
